<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Monospace -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>FiraCode Nerd Font Mono</family>
      <family>FiraCode Nerd Font</family>
    </prefer>
  </alias>

  <!-- Sans-serif -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>FiraCode Nerd Font</family>
      <family>FiraCode Nerd Font Propo</family>
      <family>Noto Sans CJK JP</family> <!-- fallback for Japanese -->
    </prefer>
  </alias>

  <!-- Serif -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>FiraCode Nerd Font Propo</family>
      <family>Noto Serif CJK JP</family>
    </prefer>
  </alias>

</fontconfig>

