[color]

;; Use pywal.sh in scripts directory to use colors from an image/wallpaper.

;; main colors (user palette: #ff0048 / #32373b / #9da2ab / #c9f299)
;; NOTE: [bar/main].background pulls from background-alt (the bar's own
;; ambient strip); chip fills + decor notch-cuts pull from background.
background = #F032373b
background-alt = #99161819
foreground = #9da2ab
foreground-alt = #ffffff
primary = #ff0048
red = #ff0048
green = #c9f299
yellow = #c9f299
muted = #5a6570

