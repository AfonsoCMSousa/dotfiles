[module/apps]
type = custom/text
content-background = ${color.background}
content-padding = 1

[module/term]
inherit = module/apps
content = 
content-foreground = #fdd835
click-left = termite &
click-middle = urxvt &
click-right = xfce4-terminal &

[module/files]
inherit = module/apps
content-foreground = #1e88e5
content = 
click-left = thunar &
click-right = pcmanfm &

[module/browser]
inherit = module/apps
content-foreground = #fb8c00
content = 
click-left = firefox &
click-right = chromium &

[module/settings]
inherit = module/apps
content-foreground = #00897b
content = 
click-left = xfce4-settings-manager &
click-right = lxappearance &

