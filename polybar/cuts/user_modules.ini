[module/updates]
type = custom/script

; Void Linux (xbps) update checker
exec = ~/.config/polybar/cuts/scripts/updates-void.sh

; Will the script output continous content?
; Default: false
tail = false

; Seconds to sleep between updates (30 min - xbps-install -S syncs repodata over the network)
interval = 1800

; Available tags:
;   <output> - deprecated
;   <label> (default)
format = <label>
format-prefix = %{T2}%{T-}
format-prefix-foreground = ${color.foreground}
format-background = ${color.background}
format-padding = 1

; Available tokens:
;   %output%
; Default: %output%
label = %output%

; "click-(left|middle|right)" will be executed using "/usr/bin/env sh -c [command]"
click-left = alacritty -e sudo xbps-install -Su &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/uptime]
type = custom/script
exec = ~/.config/polybar/cuts/scripts/uptime.sh
tail = false
interval = 60

format = <label>
format-prefix = %{T2}%{T-}
format-prefix-foreground = ${color.green}
format-background = ${color.background}
format-padding = 1

label = %output%

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/netspark]
type = custom/script
; compiled from netspark.c (launch-top.sh rebuilds it when the source changes)
exec = ~/.config/polybar/cuts/scripts/netspark enp6s0
tail = true

format = <label>
format-background = ${color.background}
format-padding = 2

label = %output%

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/anki]
type = custom/script
; `exec` matters: polybar runs this through dash, which otherwise stays
; in between as the parent, so %pid% would be dash and a click would kill it.
exec = exec ~/.config/polybar/cuts/scripts/ankibar
tail = true

format = <label>
format-background = ${color.background}
format-padding = 2

label = %output%

; left = flip / Good, right = Again, middle = skip / refresh
click-left = kill -USR1 %pid%
click-right = kill -USR2 %pid%
click-middle = kill -HUP %pid%

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/nowplaying]
type = custom/script
exec = ~/.config/polybar/cuts/scripts/nowplaying.sh
tail = false
interval = 2

format = <label>
format-background = ${color.background}
format-padding = 1

label = %output%

; left click = play/pause, scroll = next/previous track
click-left = playerctl play-pause
scroll-up = playerctl next
scroll-down = playerctl previous

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/launcher]
type = custom/text
content = %{T2}%{T-}

; "content" has the same properties as "format-NAME"
content-background = ${color.background}
content-foreground = ${color.primary}
content-padding = 1

; "click-(left|middle|right)" will be executed using "/usr/bin/env sh -c $COMMAND"
click-left = ~/.config/polybar/cuts/scripts/launcher.sh &
;;click-middle = ~/.config/polybar/cuts/scripts/launcher-full
; (right click used to run the theme's color-switch.sh; colors now follow
; the wallpaper via ~/.config/theme/theme instead)

; "scroll-(up|down)" will be executed using "/usr/bin/env sh -c $COMMAND"
;;scroll-up = ~/.config/polybar/cuts/scripts/launcher.sh &
;;scroll-down = ~/.config/polybar/cuts/scripts/color-switch.sh &

